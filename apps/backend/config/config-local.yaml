# Local development defaults. Environment variables override these values.
Application:
  Environment: "local"

Http:
  Address: ":8080"
  ReadTimeout: "30s"
  WriteTimeout: "30s"
  ApiPrefix: "/api"

Database:
  URL: "postgres://employeebot:employeebot_secret@localhost:5432/employeebot?sslmode=disable"
  MaxOpenConns: 25
  MaxIdleConns: 5
  ConnMaxLifetime: 3600

JWT:
  Secret: "local_dev_jwt_secret"
  ExpireHours: 24
